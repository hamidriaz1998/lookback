<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Lookback app icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23108e"/>
      <stop offset="0.49" stop-color="#1828c7"/>
      <stop offset="1" stop-color="#076aff"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7e8ff"/>
      <stop offset="1" stop-color="#e4fbff"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd468"/>
      <stop offset="1" stop-color="#ffaf35"/>
    </linearGradient>
  </defs>
  <!-- Square app tile -->
  <rect x="20" y="20" width="984" height="984" rx="218" fill="url(#tile)"/>
  <!-- Magnifier rim: single thick, open-ended circular sweep -->
  <path d="M 292 348 A 290 290 0 1 0 406 242" fill="none" stroke="#fff" stroke-width="59" stroke-linecap="butt"/>
  <!-- Lens handle -->
  <path d="M 713 712 L 813 813" fill="none" stroke="#fff" stroke-width="85" stroke-linecap="round"/>
  <!-- Three overlapping sheets, outlined by the negative space between them -->
  <path d="M 338 345 Q 338 323 360 323 H 514 Q 536 323 536 345 V 363 H 423 Q 393 363 393 393 V 571 H 360 Q 338 571 338 549 Z" fill="url(#paper)"/>
  <path d="M 386 394 Q 386 370 412 370 H 566 Q 590 370 590 395 V 414 H 505 Q 474 414 474 446 V 630 H 412 Q 386 630 386 603 Z" fill="url(#paper)"/>
  <!-- Note strokes on the rear page -->
  <path d="M 425 444 H 472 M 425 496 H 472 M 425 548 H 472" stroke="#1665e7" stroke-width="18" stroke-linecap="round"/>
  <!-- Foreground thumbnail/document with turned corner -->
  <path d="M 482 439 Q 482 422 501 422 H 632 V 471 Q 632 491 654 491 H 692 V 647 Q 692 669 668 669 H 504 Q 482 669 482 647 Z" fill="#fff"/>
  <path d="M 643 424 L 691 476 H 659 Q 643 476 643 459 Z" fill="#fff"/>
  <!-- Picture symbol -->
  <circle cx="613" cy="562" r="23" fill="#1069f5"/>
  <path d="M 516 628 L 559 575 Q 567 565 576 577 L 606 611 L 626 590 Q 635 580 644 590 L 672 626 Q 679 638 663 638 H 525 Q 508 638 516 628 Z" fill="#1269f6"/>
  <!-- Rewind arrow head, with warm amber contrast -->
  <path d="M 192 310 Q 188 301 197 289 L 269 200 Q 283 181 295 189 Q 304 195 305 214 L 311 258 L 337 317 Q 341 333 327 338 Q 318 342 305 339 L 213 322 Q 197 320 192 310 Z" fill="url(#amber)"/>
</svg>
