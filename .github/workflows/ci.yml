name: ci

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: "0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  lint-colors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no color literals outside internal/theme
        run: ./scripts/check-colors.sh

  cross-build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build for windows/amd64
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
